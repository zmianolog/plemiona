<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plemiona w organizacji: zadania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Zmianologica Sans";src:local("Zmianologica Sans"),local("ZmianologicaSans-Regular");font-weight:400}
@font-face{font-family:"Zmianologica Sans";src:local("Zmianologica Sans Medium"),local("ZmianologicaSans-Medium");font-weight:500}
@font-face{font-family:"Zmianologica Sans";src:local("Zmianologica Sans SemiBold"),local("ZmianologicaSans-SemiBold");font-weight:600}
@font-face{font-family:"Zmianologica Sans";src:local("Zmianologica Sans Bold"),local("ZmianologicaSans-Bold");font-weight:700}
@font-face{font-family:"Zmianologica Sans";src:local("Zmianologica Sans ExtraBold"),local("ZmianologicaSans-ExtraBold");font-weight:800}
:root{--navy:#1F4460;--navy-h:#163450;--honey:#E8B62C;--honey-txt:#5C4810;--bg:#F5F5F7;--card:#FFFFFF;--info:#F0F6FB;--txt:#1E2A33;--mute:#5A6A76;--line:#D7DEE4;
--rea:#1F4460;--eks:#E8B62C;--rel:#6E94B4;--int:#9A7414;--exbg:#E9EEF3;--tkbg:#FCF5E2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--card:#16242F;--info:#1B2C39;--txt:#E8EEF2;--mute:#9DB0BE;--line:#2A3D4B}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#16242F;--info:#1B2C39;--txt:#E8EEF2;--mute:#9DB0BE;--line:#2A3D4B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0E1820;font-family:"Zmianologica Sans",Montserrat,"Segoe UI",Arial,sans-serif;color:var(--txt);overflow:hidden}
#deck{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:var(--card)}
.s{position:absolute;inset:0;padding:60px 96px 104px;display:none;flex-direction:column;background:var(--card)}
.s.on{display:flex}
.s.ex{background:var(--exbg)}
.s.tk{background:var(--tkbg)}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--navy)}
.ex .bar,.tk .bar{background:var(--honey)}
.logoU{position:absolute;right:56px;top:30px;height:56px;max-width:280px;object-fit:contain}
.logoU:not([src]),.logoU[src=""]{display:none}
.logoZ{position:absolute;left:96px;bottom:30px;height:28px;display:flex;align-items:center}
.logoZ img{height:28px}
.logoZ span{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.pg{position:absolute;right:56px;bottom:32px;font-size:16px;font-weight:600;color:var(--mute)}
h1{font-size:92px;line-height:1.04;font-weight:800;color:var(--navy);margin:0 0 26px;max-width:11ch}
h2{font-size:42px;line-height:1.16;font-weight:700;color:var(--navy);margin:0 0 24px;max-width:none}
.s:not(.op)>h2{padding-right:220px}
p{font-size:25px;line-height:1.45;margin:0 0 14px;max-width:none}
b,strong{font-weight:700;color:var(--navy)}
.lead{color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center;flex:1;min-height:0}
.two>div{align-self:stretch;display:flex;flex-direction:column;justify-content:space-evenly;min-width:0}
.r:not(:has(.rv)){opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.r.v:not(:has(.rv)){opacity:1;transform:none}
.r.slot{opacity:1!important;transform:none!important}
.slot>*{transition:opacity .5s ease}
.slot:not(.v){background:transparent!important;border-color:transparent!important;outline:3px dashed var(--line);outline-offset:-3px}
.slot:not(.v)>*{opacity:0}
.ico{flex:0 0 58px;width:58px;height:58px;min-width:58px;border-radius:50%;background:var(--info);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.ico svg{width:28px;height:28px;stroke-width:2}
.rows{display:flex;flex-direction:column;justify-content:space-evenly}
.row{display:flex;gap:22px;align-items:flex-start;margin-bottom:14px}
.row.slot{padding:8px 12px}
.row b{display:block;font-size:26px;margin-bottom:4px}
.row p{margin:0;font-size:21px;line-height:1.42}
.src{font-size:15px;color:var(--mute);margin:8px 0 0;max-width:none}
.note{margin-top:18px;padding:14px 22px;border-left:6px solid var(--honey);background:var(--info);font-size:21px;line-height:1.45;max-width:none}
.ex .note{background:var(--card)}
/* znaczniki przykładu i zadania */
.badge{display:inline-flex;align-items:center;gap:14px;margin-bottom:18px;align-self:flex-start}
.badge .ico{position:relative;background:var(--card)}
.badge span.t{font-size:21px;font-weight:800;letter-spacing:.12em;color:var(--navy);text-transform:uppercase}
.badge small{font-size:19px;font-weight:600;color:var(--mute);letter-spacing:0;text-transform:none;margin-left:6px}
.tk .badge .ico:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--navy);opacity:0}
.on.tk .badge .ico:after{animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.steps3{display:flex;gap:10px;margin-top:auto;align-self:flex-start}
.steps3 i{font-style:normal;font-size:17px;font-weight:600;padding:8px 16px;background:var(--card);color:var(--mute)}
.steps3 i.cur{background:var(--navy);color:#fff}
.qrw{display:grid;grid-template-columns:auto 1fr;gap:70px;align-items:center;flex:1}
.qr{background:#fff;padding:22px;border:4px solid var(--navy);width:404px;height:404px}
.qr img,.qr canvas{width:360px!important;height:360px!important}
.urll{font-size:22px;color:var(--mute);margin:26px 0 4px}
.url{font-size:38px;font-weight:800;color:var(--navy);margin-top:0;word-break:break-all}
.cnt{font-size:96px;font-weight:800;color:var(--navy);line-height:1}
.cntl{font-size:24px;color:var(--mute)}
/* okładka */
.cover .two{grid-template-columns:1fr 1fr}
.btnStart{margin-top:44px;align-self:flex-start;font:inherit;font-weight:700;font-size:28px;padding:18px 36px;background:var(--navy);color:#fff;border:0;cursor:pointer;display:inline-flex;gap:14px;align-items:center}
.btnStart:hover{background:var(--navy-h)}
.btnStart:focus-visible{outline:4px solid var(--honey);outline-offset:3px}
.btnStart svg{width:28px;height:28px}
.emb{position:relative;width:640px;height:500px;justify-self:center}
.emb svg.lk{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.emb .lk line{stroke:var(--navy);stroke-width:4;stroke-linecap:round;stroke-dasharray:6 10;opacity:0;transition:opacity 1s,stroke 1s}
.emb .lk line.on2{opacity:.5}
.emb .lk line.tense{stroke:var(--honey);opacity:1;animation:tense .12s linear 8}
@keyframes tense{0%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}100%{transform:translate(0,0)}}
.emb .ring{position:absolute;border-radius:50%;border:4px solid var(--c);opacity:0;transform:scale(.7);transition:opacity .8s,transform .8s}
.emb .ring.on2{opacity:1;transform:scale(1)}
.emb .ring.joy{animation:joy .9s ease}
@keyframes joy{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 50%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.emb .d{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#A9B6C1;transition:left 1.4s cubic-bezier(.5,.1,.3,1),top 1.4s cubic-bezier(.5,.1,.3,1),background 1s,transform .4s}
.emb .d.pop{transform:scale(1.5)}
.emb .d.carry{box-shadow:0 0 0 5px var(--honey)}
.emb .d.shake{animation:shk .1s linear 8}
@keyframes shk{0%,100%{translate:0 0}25%{translate:-3px 1px}75%{translate:3px -1px}}
/* slajd otwierający część */
.op{background:var(--navy)}
.op .bar{background:var(--honey)}
.op .lbl{font-size:30px;font-weight:800;color:var(--honey);letter-spacing:.04em;margin-bottom:8px}
.op .lbl em{font-style:normal;color:#C9D6E0;font-weight:700;margin-left:14px}
.op .qq{font-size:64px;line-height:1.16;font-weight:800;color:#fff;max-width:24ch;margin:auto 0}
.op .pg,.op .logoZ span{color:#9DB3C4}
.prog{display:flex;gap:10px;margin-top:auto}
.prog i{font-style:normal;flex:1;padding:12px 14px;font-size:17px;font-weight:600;color:#9DB3C4;border-top:5px solid #3B5C76}
.prog i.done{border-color:#9DB3C4}
.prog i.cur{border-color:var(--honey);color:#fff}
/* warunki */
.wk{display:flex;flex-direction:column;gap:12px}
.wk .w{display:grid;grid-template-columns:58px 1fr 40px 1fr;gap:16px;align-items:center;background:var(--info);padding:14px 18px}
.wk .w.slot{outline-offset:-3px}
.wk .w .ico{background:var(--card)}
.wk .w b{display:block;font-size:22px}
.wk .w p{font-size:19px;margin:0;line-height:1.38}
.wk .w .ar{color:var(--honey);display:flex;justify-content:center}
.wk .w .ar svg{width:30px;height:30px;stroke-width:3}
.wk .hd{display:grid;grid-template-columns:58px 1fr 40px 1fr;gap:16px;font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:0 18px}
.stat{background:var(--info);padding:26px 30px;border-top:6px solid var(--honey)}
.stat .sn{font-size:110px;font-weight:800;color:var(--navy);line-height:1;margin-bottom:10px}
.stat p{font-size:20px}
/* doba */
.clk{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.clk .lab{font-size:21px;font-weight:700;color:var(--navy)}
.clk .lab small{font-weight:600;color:var(--mute);font-size:18px;margin-left:10px}
.dbar{position:relative;height:56px;background:var(--info)}
.dbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--navy);transition:width 2.2s ease}
.dbar .last{position:absolute;right:-4px;top:-8px;bottom:-8px;width:calc(100%/24 + 8px);border:4px solid var(--honey);opacity:0;transition:opacity .6s}
.tk2{display:flex;justify-content:space-between;font-size:16px;font-weight:600;color:var(--mute)}
.zoomln{height:50px;position:relative}
.zoomln svg{position:absolute;inset:0;width:100%;height:100%}
.zoomln path{fill:color-mix(in srgb,var(--honey) 16%,transparent);stroke:var(--honey);stroke-width:3;opacity:0;transition:opacity .6s}
.zbar{position:relative;height:56px;background:var(--navy);opacity:0;transition:opacity .6s;margin-bottom:150px}
.zbar .seg{position:absolute;top:0;bottom:0;right:0;background:var(--honey);width:0;transition:width 1s ease}
.mk{position:absolute;top:0;bottom:0;width:0;opacity:0;transition:opacity .5s}
.mk:before{content:"";position:absolute;left:-3px;top:-10px;height:calc(100% + 26px);width:6px;background:var(--honey)}
.mk.r2:before{height:calc(100% + 92px)}
.mk div{position:absolute;top:calc(100% + 20px);width:340px;font-size:18px;line-height:1.3;font-weight:600;color:var(--txt)}
.mk.r2 div{top:calc(100% + 86px)}
.mk div b{display:block;font-size:22px}
.mk.lf div{left:12px;text-align:left}
.mk.ct div{left:-170px;text-align:center}
.mk.rt div{right:12px;text-align:right}
.mk.v{opacity:1}
.clkn{opacity:0;transition:opacity .6s;margin:0}
.clkn.v{opacity:1}
/* pola kropek */
.fld{position:relative;width:640px;height:520px;justify-self:center}
.fld .d{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#A9B6C1;transition:left 1.2s ease,top 1.2s ease,background .7s,transform .5s,box-shadow .5s}
.fld .d.dev{background:var(--honey)!important;transform:scale(1.35);box-shadow:0 0 0 8px color-mix(in srgb,var(--honey) 35%,transparent)}
.fld .zone{position:absolute;border:4px solid transparent;border-radius:28px;transition:left 1.2s ease,border-color .6s,background .6s}
.fld .zone.mark{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.fld .zl{position:absolute;top:-22px;left:24px;padding:4px 14px;font-size:19px;font-weight:800;color:#fff;background:var(--c);opacity:0;transition:opacity .5s}
.fld .zone.mark .zl{opacity:1}
.fld .tagx{position:absolute;font-size:44px;font-weight:800;color:var(--navy);opacity:0;transition:opacity .6s,left 1.2s ease}
.fld .tagx.v{opacity:1}
#diff .two{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr)}
#fldD{transform:scale(.8);transform-origin:50% 50%;margin:-52px -64px;align-self:center}
#fldD{transform:scale(.74);transform-origin:left center}
.tj{display:grid;grid-template-columns:1fr 1fr;gap:20px;opacity:0;transition:opacity .6s}
.tj.v{opacity:1}
.tj .op2{background:var(--info);padding:16px 20px;border:4px solid transparent;transition:border-color .5s}
.tj .op2.pick{border-color:var(--honey)}
.tj .op2 small{display:block;font-size:16px;font-weight:700;color:var(--mute);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.tj .bars{display:flex;gap:14px;align-items:flex-end;height:150px}
.tj .bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:17px;font-weight:700;color:var(--mute);height:100%}
.tj .bars i{display:block;width:100%;background:var(--c);transition:height 1s ease;height:0}
.tj .bars em{font-style:normal;font-size:26px;font-weight:800;color:var(--navy);margin-bottom:4px}
/* kibice */
.hb{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.hb .st{background:var(--info);padding:22px 26px;transition:opacity .5s}
.hb .st>b{display:block;font-size:24px;margin-bottom:4px}
.hb .st>small{display:block;font-size:18px;color:var(--mute);margin-bottom:16px;line-height:1.35}
.hb .ln{display:grid;grid-template-columns:210px 1fr 70px;gap:14px;align-items:center;margin-bottom:12px;font-size:19px;font-weight:600}
.hb .ln .tr{height:32px;background:var(--card)}
.hb .ln .tr i{display:block;height:100%;width:0;background:var(--c);transition:width 1.2s ease}
.hb .ln em{font-style:normal;font-weight:800;font-size:23px;color:var(--navy)}
/* tabele */
.tbl{display:grid;gap:6px;font-size:19px;line-height:1.36}
.tbl>div,.tbl .rw>div{padding:11px 14px;background:var(--info)}
.tbl .th{background:var(--navy)!important;color:#fff;font-weight:700;font-size:17px}
.tbl .rw{display:contents}
.tbl .rw>div{transition:opacity .5s}
.tbl .rw.slot:not(.v)>div{opacity:0}
.tbl .rw .pn{font-weight:800;color:var(--navy)}
.tbl .rw .bd{border-left:5px solid var(--honey)}
.tbl .rw .ok{border-left:5px solid var(--navy)}
.ex .tbl>div,.ex .tbl .rw>div{background:var(--card)}
/* sieć */
.net{display:grid;grid-template-columns:540px 1fr;gap:60px;flex:1;align-items:center}
.net svg{width:540px;height:540px}
.net svg line{stroke:var(--navy);stroke-width:1.4}
.net svg circle{fill:var(--honey);stroke:var(--navy);stroke-width:2}
.nc{display:flex;flex-direction:column;gap:10px}
.nc .c{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;background:var(--info);padding:8px 20px}
.nc .c .n1{font-size:20px;font-weight:700;color:var(--mute)}
.nc .c .n1 b{display:inline;font-size:34px;color:var(--navy);margin-right:8px}
.nc .c .n2{font-size:20px}
.nc .c .n2 b{display:inline;font-size:34px;margin-right:8px}
/* historia łączenia plemion */
.hx{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.hx:before{content:"";position:absolute;left:0;right:0;top:34px;height:4px;background:var(--line)}
.hx .c{position:relative;padding-top:72px}
.hx .c .ico{position:absolute;top:5px;left:0;background:var(--navy);color:#fff}
.hx .c b{display:block;font-size:22px;margin-bottom:6px}
.hx .c p{font-size:19px;margin:0;line-height:1.4}
.dil{display:grid;grid-template-columns:1fr 150px 1fr;gap:16px;align-items:center;margin-top:64px}
.dil .c{background:var(--info);padding:18px 22px;border-top:6px solid var(--c)}
.dil .c b{display:block;font-size:22px;margin-bottom:4px}
.dil .c p{font-size:19px;margin:0}
.dil .vs{font-size:26px;white-space:nowrap;font-weight:800;color:var(--honey);text-align:center}
/* reguła poziomów */
.org{position:relative;width:640px;height:500px;justify-self:center;border:4px dashed var(--line);transition:border-color .6s,background .6s}
.org.whole{border-style:solid;border-color:var(--honey);background:color-mix(in srgb,var(--honey) 7%,transparent)}
.org .ol{position:absolute;left:20px;top:-18px;background:var(--card);padding:0 12px;font-size:19px;font-weight:800;color:var(--mute);transition:color .6s}
.org.whole .ol{color:var(--honey-txt)}
.org .tm{position:absolute;width:220px;height:160px;border:4px solid var(--line);background:var(--card);transition:border-color .6s,border-width .6s}
.org .tm.coh{border-color:var(--c);border-width:7px}
.org .tm span{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--c);transition:left 1s ease,top 1s ease}
.org .tm em{position:absolute;bottom:8px;left:12px;font-style:normal;font-size:16px;font-weight:700;color:var(--mute)}
.org svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.org svg .ab{stroke:var(--navy);stroke-width:5;fill:none;opacity:0;transition:opacity .6s}
.org svg .ab.v{opacity:1}
.org .xm{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--card);border:4px solid var(--navy);display:flex;align-items:center;justify-content:center;color:var(--navy);opacity:0;transition:opacity .5s,background .5s,border-color .5s}
.org .xm svg{position:static;width:24px;height:24px;stroke-width:3}
.org .xm.v{opacity:1}
.org .xm.ok{background:var(--honey);border-color:var(--honey);color:#5C4810}
/* dwa rodzaje sporu */
.sp2{display:grid;grid-template-columns:1fr 1fr;gap:30px;flex:1;align-content:center;align-items:stretch}
.sp2 .c{background:var(--info);padding:24px 28px;border-top:6px solid var(--c);display:flex;flex-direction:column}
.sp2 .c .tag{display:inline-block;align-self:flex-start;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;background:var(--c);color:var(--fc);margin-bottom:12px}
.sp2 .c b{display:block;font-size:27px;margin-bottom:8px}
.sp2 .c p{font-size:20px;margin:0 0 10px}
.sp2 .c .qts{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.qt{font-size:19px;font-style:italic;padding:10px 14px;background:var(--card);line-height:1.4}
.def{padding:12px 20px;border-left:6px solid var(--navy);background:var(--info);font-size:21px;line-height:1.45;margin-bottom:14px;max-width:none}
/* SYNVARIA: dwie warstwy */
.lay{position:relative;width:600px;height:460px;justify-self:center}
.lay .ly{position:absolute;left:30px;right:30px;padding:20px 26px;border:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));transition:transform .8s ease,opacity .6s}
.lay .ly b{display:block;font-size:24px;margin-bottom:4px}
.lay .ly p{font-size:18px;margin:0}
.lay .ly .tg{position:absolute;right:16px;top:-16px;background:var(--c);color:var(--fc);font-size:14px;font-weight:800;letter-spacing:.06em;padding:3px 10px;text-transform:uppercase}
.lay .l1{top:240px}
.lay .l2{top:40px;opacity:0;transform:translateY(-30px)}
.lay .l2.v{opacity:1;transform:none}
/* nazwa */
.nm{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:24px}
.nm .w{display:flex;align-items:flex-end}
.nm .w span{font-size:140px;font-weight:800;line-height:1;letter-spacing:.02em;transition:margin .9s ease}
.nm .w .a{color:var(--navy)}
.nm .w .b{color:var(--honey)}
.nm .w.split .a{margin-right:120px}
.nm .gl{display:grid;grid-template-columns:1fr 1fr;gap:60px;width:1200px}
.nm .gl div{background:var(--info);padding:20px 26px;opacity:0;transition:opacity .6s;border-top:6px solid var(--c)}
.nm .gl div.v{opacity:1}
.nm .gl b{font-size:28px;display:block;margin-bottom:6px}
.nm .gl p{font-size:21px;margin:0}

.side{display:flex;flex-direction:column;gap:10px;min-height:0}

/* animacja z lektorem */
.av{position:relative;flex:1;margin:-10px 0 0}

.av .bub.v{opacity:1}
.av .bub.ctr{transform:translateX(-50%);white-space:nowrap;max-width:none}

.av .clkw i{position:absolute;left:50%;top:50%;width:5px;height:36px;margin-left:-2.5px;background:var(--honey);transform-origin:50% 0;transform:rotate(180deg)}

.av .fin{position:absolute;left:0;right:0;bottom:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;opacity:0;transition:opacity .6s}

/* sceny przykładów */
.scn{position:relative;flex:1;background:var(--card);border:3px solid var(--line);overflow:hidden}

.scn .tok{position:absolute;z-index:3;padding:6px 12px;background:var(--honey);color:#5C4810;font-weight:800;font-size:16px;border:3px solid var(--navy);transition:left .9s ease,top .9s ease,opacity .4s;transform:translate(-50%,-50%)}

.cs{display:grid;grid-template-columns:1fr 1fr;gap:36px;flex:1;align-content:center}

@media (prefers-reduced-motion:reduce){.r,.emb .d,.fld .d{transition:none}.on.tk .badge .ico:after,.mini .cl.me:after{animation:none!important}}
/* archetypy z lektorem */
.s#arch{position:relative}
.arc.ctl{position:absolute;right:96px;top:112px;display:flex;gap:8px;z-index:5}
.arc button{font:inherit;font-weight:700;font-size:17px;padding:10px 16px;background:var(--navy);color:#fff;border:0;cursor:pointer;display:flex;gap:8px;align-items:center}
.arc button svg{width:20px;height:20px}
.arw{position:relative;flex:1;display:flex;min-height:0}
.arw .ag{flex:1}
.ag .cl{transition:opacity .45s,transform .45s,box-shadow .45s}
.ag .hd{transition:opacity .45s,background .45s}
.ag.dim .cl:not(.act){opacity:.28}
.ag.dim .hd:not(.act){opacity:.4}
.ag .cl.act{transform:scale(1.035);box-shadow:0 0 0 3px var(--honey),0 10px 24px rgba(31,68,96,.18);position:relative;z-index:2}
.ag .hd.act{background:color-mix(in srgb,var(--honey) 22%,var(--card))}
.arq{position:absolute;inset:0;z-index:4;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;gap:56px;opacity:0;pointer-events:none;transition:opacity .5s}
.arq.v{opacity:1}
.arq .qs{display:flex;flex-direction:column;gap:22px;width:560px}
.arq .qc{background:var(--info);border-left:6px solid var(--navy);padding:18px 22px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.arq .qc.v{opacity:1;transform:none}
.arq .qc small{display:block;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--honey)}
.arq .qc b{display:block;font-size:26px;color:var(--navy);margin:4px 0 12px}
.arq .qc .op{display:flex;gap:10px}
.arq .qc .op span{flex:1;text-align:center;background:var(--card);border:2px solid var(--line);padding:9px;font-size:19px;font-weight:600;color:var(--navy)}
.arq .mx{display:grid;grid-template-columns:150px 190px 190px;grid-auto-rows:auto;gap:8px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.arq .mx.v{opacity:1;transform:none}
.arq .mh{text-align:center;font-size:17px;font-weight:700;color:var(--mute);padding:4px}
.arq .mv{display:flex;align-items:center;justify-content:flex-end;text-align:right;font-size:17px;font-weight:700;color:var(--mute);padding-right:6px}
.arq .me{background:var(--c);color:var(--fc);height:110px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.arb{position:relative;height:74px;flex:none;margin-top:16px}
.arb .cap{position:absolute;left:0;right:0;top:0;text-align:center;font-size:19px;color:var(--mute);line-height:1.3;min-height:26px}
.arb .tl{position:absolute;left:0;right:0;bottom:0;height:28px;cursor:pointer;touch-action:none;z-index:6}
.arb .tl:before{content:"";position:absolute;left:0;right:0;top:11px;height:6px;background:var(--line)}
.arb .tl i{position:absolute;left:0;top:11px;height:6px;width:0;background:var(--honey)}
.arb .tl b{position:absolute;top:14px;left:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s}
.arb .tl:hover b,.arb .tl.drag b{transform:scale(1.25)}
#arch .ag .cl{min-height:0;padding:10px 14px}
#arch .ag{gap:8px}
/* zadanie: sprawdź tarcie */
.trw{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:40px;flex:1;min-height:0;align-items:stretch;margin-top:10px}
.tri h2{font-size:34px;line-height:1.2;margin:0 0 18px;max-width:none}
.tri ol{margin:0 0 18px;padding-left:28px}
.tri li{font-size:21px;line-height:1.4;margin-bottom:12px}
.tri .tm{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--navy);margin:0 0 10px}
.tri .tm svg{width:26px;height:26px}
.tri .urll{font-size:18px;color:var(--mute)}
.tri .urll b{color:var(--navy)}
.nmap{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));grid-template-rows:auto repeat(4,minmax(0,1fr));gap:6px}
.nmap .hd{font-size:15px;font-weight:700;color:var(--mute);text-align:center;line-height:1.2;align-self:end;padding-bottom:4px}
.nmap .rh{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--navy)}
.nmap .rh i{width:12px;height:44px;background:var(--c)}
.nmap .nc{background:color-mix(in srgb,var(--c) 12%,var(--card));border-left:5px solid var(--c);padding:6px 8px;position:relative;overflow:hidden}
.nmap .nc.off{background:repeating-linear-gradient(45deg,var(--info),var(--info) 8px,var(--card) 8px,var(--card) 16px);border-left-color:var(--line)}
.nmap .nc .k{font-size:12px;font-weight:700;color:var(--mute)}
.nmap .nk{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.nmap .nk span{font-size:14px;font-weight:700;padding:2px 7px;background:var(--c);color:var(--fc);line-height:1.3}
.nmap .nk span.more{background:var(--card);color:var(--navy);border:1px solid var(--line)}
#phone .who{font-size:13px;font-weight:700;color:var(--mute);margin:0 0 6px}
#tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
#tabs button,#frb,#phone #again{font:inherit;font-weight:700;font-size:16px;padding:12px 10px;border:2px solid var(--navy);background:var(--card);color:var(--navy);cursor:pointer;width:100%}
#tabs button.cur,#frb,#phone #again{background:var(--navy);color:#fff}
#frb{margin:6px 0 14px}
#phone input[type=text]{font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);width:100%;box-sizing:border-box;height:auto;flex:none;margin:0}
#phone input[type=text]:focus{outline:none;border-color:var(--navy)}
#phone .hint{font-size:13px;color:var(--mute)}
#phone .warn{color:var(--navy);background:var(--info);padding:10px}
.fg{background:var(--card);padding:14px;margin:0 0 12px;border-left:6px solid var(--c)}
.fg.g0{--c:#6E94B4}.fg.g1{--c:#E8B62C}.fg.g2{--c:#1F4460}
.fgh{display:flex;justify-content:space-between;align-items:center}
.fgh b{font-size:18px;color:var(--navy)}
.fgh span{font-weight:800;font-size:15px;background:var(--info);padding:2px 10px;color:var(--navy)}
.fg>p{font-size:14px!important;color:var(--mute);margin:6px 0 10px}
.fp{padding:9px 0;border-top:1px solid var(--line)}
.fpn{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fpn b{font-size:16px;color:var(--navy)}
.fp .ch{font-size:13px;font-weight:700;padding:2px 8px;background:var(--c);color:var(--fc)}
.fp small{display:block;font-size:13px;color:var(--mute);margin-top:4px;line-height:1.4}
@media (min-width:1000px){#phone{max-width:1180px}#out{display:grid!important;grid-template-columns:1fr 1fr;gap:32px;align-items:start}#out .who,#out .warn{grid-column:1/-1}#tabs{display:none}#pTeam,#pFirm{display:block!important}}
#fr{scroll-margin-top:80px}
.fsc{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--mute);margin:4px 0 12px}
.fsc i{flex:1;height:10px;background:linear-gradient(90deg,#1F4460,#4F7598,#B9CDDD,#E8B62C,#94600C)}
.fb{background:var(--card);padding:12px 12px 6px;margin:0 0 12px}
.fbh{display:flex;justify-content:space-between;align-items:center}
.fbh b{font-size:17px;color:var(--navy)}
.fbh span{font-weight:800;font-size:14px;background:var(--info);padding:2px 10px;color:var(--navy)}
.fb>p{font-size:13px!important;line-height:1.4!important;color:var(--mute);margin:4px 0 8px}
.lv{border-left:10px solid var(--c);padding:6px 0 6px 10px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 10%,var(--card))}
.lv.empty{opacity:.45}
.lvh{display:flex;align-items:center;gap:6px}
.lvh i{display:none}
.lvh small{font-size:12px;font-weight:700;color:var(--mute)}
.lvc{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;min-height:4px}
.lvc .nk,.lvc .me{font:inherit;font-size:14px;font-weight:700;padding:4px 9px;border:0;background:var(--c);color:var(--fc);cursor:pointer;line-height:1.3}
.lvc .me{background:var(--card);color:var(--navy);border:2px solid var(--navy);cursor:default}
.lvc .nk.sel{outline:3px solid var(--navy);outline-offset:1px}
.lvd .fp{border-top:0;padding:8px 8px 4px 0}
</style>

 '<fieldset><legend>Twoje imię albo nick</legend><div class="op3"><input type="text" id="nick" name="nick" maxlength="24" autocomplete="off" required placeholder="na przykład Ania albo Kawosz"><small class="hint">Pozostali uczestnicy zobaczą tę nazwę przy twoim archetypie.</small></div></fieldset>'+

 '<button id="send" type="submit" disabled>Pokaż wynik</button></form>';
